# Dagster instance config.
# Stored under $DAGSTER_HOME and read by the webserver + daemon.
# The run store, event log, and schedule storage all live in the dedicated dagster-postgres instance.

run_storage:
  module: dagster_postgres.run_storage
  class: PostgresRunStorage
  config:
    postgres_db:
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      hostname:
        env: DAGSTER_POSTGRES_HOST
      db_name:
        env: DAGSTER_POSTGRES_DB
      port: 5432

event_log_storage:
  module: dagster_postgres.event_log
  class: PostgresEventLogStorage
  config:
    postgres_db:
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      hostname:
        env: DAGSTER_POSTGRES_HOST
      db_name:
        env: DAGSTER_POSTGRES_DB
      port: 5432

schedule_storage:
  module: dagster_postgres.schedule_storage
  class: PostgresScheduleStorage
  config:
    postgres_db:
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      hostname:
        env: DAGSTER_POSTGRES_HOST
      db_name:
        env: DAGSTER_POSTGRES_DB
      port: 5432

# Run coordinator: default queues up to 10 concurrent runs. Plenty for our scale.
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 10
    tag_concurrency_limits:
      - key: "dagster/concurrency_key"
        value: "backfill"
        limit: 1

# Retention: we keep Dagster's own event history for 30 days. Longer than that,
# the dagster-postgres volume grows without bound for no operational benefit.
retention:
  schedule:
    purge_after_days: 30
  sensor:
    purge_after_days: 30

# Compute log capture: writes per-step stdout/stderr to disk for the UI.
# Pinned to /tmp explicitly because the three Dagster containers run as
# different users (dagster vs ql) with different DAGSTER_HOME values, and
# Dagster's default path resolution can land on a directory that isn't
# writable by the executing user. /tmp is writable by all users and the
# logs are appropriately ephemeral.
compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /tmp/dagster-compute-logs

# Run monitoring: the daemon checks for runs that have died and marks them failed.
run_monitoring:
  enabled: true
  # How often the daemon checks for runs whose process has died.
  poll_interval_seconds: 120
  # A run in STARTING that never reaches STARTED within this window is failed.
  start_timeout_seconds: 300
  # A run whose process vanishes (no heartbeat) is marked failed after this.
  # (cancel path) how long a CANCELING run can hang before forced to CANCELED.
  cancel_timeout_seconds: 300
  # Max times the daemon will resume a run after a crash before giving up.
  max_resume_run_attempts: 0
  # Hard ceiling on how long a run may stay in STARTED. Without it the run queue
  # wedges permanently: the DefaultRunLauncher reports
  # supports_check_run_worker_health = False, so the MonitoringDaemon cannot detect a
  # run whose worker died (start_timeout_seconds only covers STARTING). Every crash
  # or container restart then orphans a run that holds its concurrency slot for good
  # — ten of those saturates max_concurrent_runs and nothing is ever dequeued again.
  # That is what cost us 2026-09-10 → 09-26. A runtime cap is enforced regardless of
  # launcher health-check support, so it is what actually reaps the orphans.
  #
  # Sized against observed SUCCESS durations: parquet_export_daily 404-530 s,
  # static_gtfs_daily ~80 s, ttc_realtime_30s ~6 s. Deliberately generous — a false
  # kill of the daily S3 export costs archived data, a slow reap costs 30 minutes.
  max_runtime_seconds: 1800
